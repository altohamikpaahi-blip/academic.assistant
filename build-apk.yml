name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # لو مجلد android مش موجود (أول مرة)، Capacitor بيولّده كامل
      # بكل ملفات Gradle والـ wrapper تلقائياً.
      - name: Create native Android project (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # نطبّق التعديلات المخصصة بتاعتنا فوق المشروع اللي Capacitor ولّده:
      # الصلاحيات، FileProvider، اسم التطبيق.
      - name: Apply custom Android overrides
        run: |
          cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-overrides/MainActivity.java android/app/src/main/java/com/university/academicassistant/MainActivity.java
          cp android-overrides/strings.xml android/app/src/main/res/values/strings.xml
          mkdir -p android/app/src/main/res/xml
          cp android-overrides/file_paths.xml android/app/src/main/res/xml/file_paths.xml

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
